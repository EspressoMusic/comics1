<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peymiz – Reset Password</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center;
           align-items: center; height: 100vh; margin: 0; background: #f0f0f0; }
    .card { background: #fff; border-radius: 18px; padding: 36px 28px;
            text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,.12); max-width: 340px; }
    h2 { margin-bottom: 8px; color: #1a1a1a; }
    p  { color: #666; margin-bottom: 28px; line-height: 1.5; }
    a  { display: block; background: #4f46e5; color: #fff; padding: 14px;
         border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 16px; }
  </style>
</head>
<body>
<div class="card">
  <h2>Reset Your Password</h2>
  <p>Tap the button below to open the Peymiz app and set a new password.</p>
  <a id="btn" href="#">Open Peymiz App</a>
</div>
<script>
  var p = window.location.search;
  var h = window.location.hash;
  document.getElementById('btn').href = 'bizmi://auth-callback' + p + h;
</script>
</body>
</html>
